<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holdfast Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f6; --surface:#ffffff; --line:#dde3e6; --fg:#14201f; --muted:#5d6b6a;
  --accent:#0d6b62; --accent-soft:#d8ece9;
  --good:#1d7a3e; --good-bg:#dff2e5; --warn:#9a6a00; --warn-bg:#fbefd2; --bad:#b3261e; --bad-bg:#fbe1de;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1514; --surface:#17201f; --line:#2a3634; --fg:#e6eeec; --muted:#93a3a0;
  --accent:#4cc3b4; --accent-soft:#183a36;
  --good:#6fd492; --good-bg:#16301f; --warn:#e9bf5a; --warn-bg:#352a10; --bad:#ff8a80; --bad-bg:#3a1a17; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:grid;gap:4px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.total{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,48px);line-height:1.05}
.sub{color:var(--muted);font-size:14px}
.up{color:var(--good)} .down{color:var(--bad)}
.banner{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--fg)}
.banner.err{background:var(--bad-bg)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font:500 14px var(--body);background:none;border:0;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.tick{font-weight:600}
.name{color:var(--muted);font-size:13px}
.right{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.chip.ev{background:var(--accent-soft);color:var(--accent)}
.chip.hit{background:var(--bad-bg);color:var(--bad)}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:18px}
.back{justify-self:start;background:none;border:0;color:var(--accent);font:500 14px var(--body);cursor:pointer;padding:0}
.ratios{display:grid;gap:6px}
.ratio{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:6px;border-left:4px solid var(--line);background:var(--bg)}
.ratio.good{background:var(--good-bg);border-color:var(--good)}
.ratio.warn{background:var(--warn-bg);border-color:var(--warn)}
.ratio.bad{background:var(--bad-bg);border-color:var(--bad)}
.ratio .peer{color:var(--muted);font-size:12px}
.ratio .why{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.pc{grid-template-columns:1fr}}
.pc ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:grid;gap:2px}
.kv b{font-family:var(--mono);font-weight:500}
.kv small{color:var(--muted);font-size:12px}
.recs{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.recs span{display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.event,.alert,.hold{display:grid;gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.event{grid-template-columns:64px 1fr}
.alert,.hold{grid-template-columns:1fr auto}
.event:first-child,.alert:first-child,.hold:first-child{border-top:0}
.date{font-family:var(--mono);font-size:13px;color:var(--accent);line-height:1.3}
.etype{font-size:12.5px;color:var(--muted)}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input,select{font:14px var(--body);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input.sm{width:96px}
input.key{width:min(320px,100%)}
.btn{font:600 14px var(--body);background:var(--accent);color:var(--surface);border:0;border-radius:6px;padding:9px 14px;cursor:pointer}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.loading{color:var(--muted);font-size:14px;padding:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Holdfast</div>
    <div class="total num" id="total">—</div>
    <div class="sub" id="totalSub">Loading prices…</div>
  </header>
  <div id="msg"></div>
  <nav role="tablist">
    <button role="tab" data-v="portfolio" aria-selected="true">Portfolio</button>
    <button role="tab" data-v="calendar" aria-selected="false">Calendar</button>
    <button role="tab" data-v="alerts" aria-selected="false">Alerts</button>
    <button role="tab" data-v="settings" aria-selected="false">Holdings</button>
  </nav>
  <main id="view"></main>
  <p class="note">Data from Finnhub. Prices in US dollars and may be delayed. Analyst figures are other people's estimates, not advice.</p>
</div>

<script>
/* ---------- storage ---------- */
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let holdings=load("hf-holdings",[{t:"AVGO",sh:10,cost:180},{t:"AAPL",sh:5,cost:190},{t:"KO",sh:15,cost:60}]);
let alerts=load("hf-alerts",[{t:"AVGO",dir:"below",pct:10},{t:"KO",dir:"above",pct:10}]);

/* ---------- Finnhub ---------- */
const API="https://holdfast-api.julianjstockdale.workers.dev";
const mem={};
async function fh(path,params={},ttlMin=1){
  const u=new URL(API+path);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const ck=path+"?"+u.searchParams.toString();
  const hit=mem[ck]||load("hfc:"+ck,null);
  if(hit&&Date.now()-hit.at<ttlMin*60000)return hit.data;
  const r=await fetch(u);
  if(r.status===401)throw new Error("key");
  if(r.status===403)throw new Error("plan");
  if(r.status===429)throw new Error("limit");
  if(!r.ok)throw new Error("net");
  const data=await r.json();
  mem[ck]={at:Date.now(),data};
  if(ttlMin>=60)save("hfc:"+ck,{at:Date.now(),data});
  return data;
}
const errText=e=>({key:"The data service isn't set up correctly. Check the FINNHUB_KEY secret in Cloudflare.",plan:"Not available (not in Finnhub's free plan, or the request came from outside your site).",limit:"Too many requests in a minute. Wait 60 seconds and refresh.",net:"Couldn't reach Finnhub. Check your connection."})[e.message]||"Something went wrong loading data.";

/* ---------- helpers ---------- */
const fmt=(v,d=0)=>v==null||isNaN(v)?"—":"$"+Number(v).toLocaleString("en-NZ",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>v==null||isNaN(v)?"—":(v>=0?"+":"")+v.toFixed(1)+"%";
const iso=d=>d.toISOString().slice(0,10);
const nice=s=>new Date(s+"T00:00:00").toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const median=a=>{const v=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!v.length)return null;const m=Math.floor(v.length/2);return v.length%2?v[m]:(v[m-1]+v[m])/2};
const pos=v=>v!=null&&isFinite(v)&&v>0?v:null;

const RATIOS=[
 {n:"P/E (trailing)",g:m=>pos(m.peTTM??m.peBasicExclExtraTTM??m.peExclExtraTTM),dir:"low",u:"×",h:"Share price compared with the last 12 months of profit. Lower means cheaper."},
 {n:"Price / sales",g:m=>pos(m.psTTM),dir:"low",u:"×",h:"Share price compared with revenue."},
 {n:"Revenue growth (1y)",g:m=>m.revenueGrowthTTMYoy,dir:"high",u:"%",h:"How fast sales grew over the past year."},
 {n:"Gross margin",g:m=>m.grossMarginTTM,dir:"high",u:"%",h:"Share of sales left after making the product. Shows pricing power."},
 {n:"Net margin",g:m=>m.netProfitMarginTTM,dir:"high",u:"%",h:"Share of sales kept as profit."},
 {n:"Return on equity",g:m=>m.roeTTM,dir:"high",u:"%",h:"Profit made on shareholders' money."},
 {n:"Debt / equity",g:m=>m["totalDebt/totalEquityQuarterly"],dir:"low",u:"×",h:"Debt compared with shareholders' money. Lower is safer."},
 {n:"Dividend yield",g:m=>m.currentDividendYieldTTM??m.dividendYieldIndicatedAnnual,dir:"high",u:"%",h:"Yearly dividend as a share of the price."}
];
function grade(v,peer,dir){
  if(v==null||peer==null||!isFinite(v)||!isFinite(peer))return "none";
  const base=Math.abs(peer)||1, d=(v-peer)/base, better=dir==="high"?d:-d;
  return better>0.1?"good":better<-0.1?"bad":"warn";
}
const LABEL={good:"Better than peers",warn:"In line with peers",bad:"Worse than peers",none:"No peer comparison"};
const show1=(v,u)=>v==null||!isFinite(v)?"—":(Math.abs(v)>=100?v.toFixed(0):v.toFixed(1))+u;

/* ---------- data ---------- */
const state={quotes:{},metrics:{},events:[]};
function msg(t,err){document.getElementById("msg").innerHTML=t?`<div class="banner${err?" err":""}">${t}</div>`:""}

async function loadPortfolio(){
  msg("");
  for(const h of holdings){
    try{state.quotes[h.t]=await fh("/quote",{symbol:h.t},1)}catch(e){msg(errText(e),true);if(e.message==="key")break}
    try{state.metrics[h.t]=(await fh("/stock/metric",{symbol:h.t,metric:"all"},720)).metric||{}}catch(e){}
  }
  renderHeader();
  if(current.v==="portfolio"&&current.i==null)show("portfolio");
  loadEvents();
}
async function loadEvents(){
  const from=iso(new Date()),to=iso(new Date(Date.now()+200*864e5)),ev=[];
  for(const h of holdings){
    try{const r=await fh("/calendar/earnings",{symbol:h.t,from,to},360);(r.earningsCalendar||[]).forEach(e=>ev.push({d:e.date,t:h.t,k:"Earnings",x:`Q${e.quarter??"?"} results${e.hour==="bmo"?" before market open":e.hour==="amc"?" after market close":""}.${e.epsEstimate!=null?` Analysts expect $${e.epsEstimate.toFixed(2)} earnings per share.`:""}`}))}catch(e){}
    try{const r=await fh("/stock/dividend",{symbol:h.t,from:iso(new Date(Date.now()-30*864e5)),to},720);(r||[]).forEach(e=>{if(e.payDate&&e.payDate>=from)ev.push({d:e.payDate,t:h.t,k:"Dividend payment",x:`$${Number(e.amount).toFixed(2)} per share · about ${fmt(e.amount*h.sh,2)} for you.`})})}catch(e){state.divLocked=true}
  }
  state.events=ev.sort((a,b)=>a.d.localeCompare(b.d));
  if(current.v!=="settings"&&current.i==null)show(current.v);
}

/* ---------- views ---------- */
function renderHeader(){
  let val=0,cost=0,day=0,inc=0,ok=true;
  holdings.forEach(h=>{const q=state.quotes[h.t];if(!q||!q.c){ok=false;return}
    val+=h.sh*q.c;cost+=h.sh*h.cost;day+=h.sh*(q.d||0);
    const m=state.metrics[h.t]||{};inc+=h.sh*(m.dividendPerShareTTM??m.dividendPerShareAnnual??0)});
  document.getElementById("total").textContent=val?fmt(val):"—";
  if(!val){document.getElementById("totalSub").textContent="Loading prices…";return}
  const g=val-cost;
  document.getElementById("totalSub").innerHTML=`<span class="num ${g>=0?"up":"down"}">${g>=0?"+":""}${fmt(g)} (${pct(g/cost*100)})</span> since bought · <span class="num ${day>=0?"up":"down"}">${day>=0?"+":""}${fmt(day)}</span> today${inc?` · about <span class="num">${fmt(inc)}</span> a year in dividends`:""}${ok?"":" · some prices missing"}`;
}
function alertHit(a){const q=state.quotes[a.t],h=holdings.find(x=>x.t===a.t);if(!q||!q.c||!h)return null;
  const mv=(q.c-h.cost)/h.cost*100;return (a.dir==="above"?mv>=a.pct:mv<=-a.pct)?mv:null}
function portfolio(){
  if(!holdings.length)return `<div class="panel"><p class="note">No holdings yet. Add one under Holdings.</p></div>`;
  return `<div class="list">${holdings.map((h,i)=>{const q=state.quotes[h.t]||{};const g=q.c?(q.c-h.cost)/h.cost*100:null;
    const next=state.events.find(e=>e.t===h.t);const hits=alerts.filter(a=>a.t===h.t&&alertHit(a)!=null);
    return `<button class="row" data-i="${i}"><div><div class="tick">${esc(h.t)}</div><div class="name">${h.sh} shares · bought at ${fmt(h.cost,2)}</div></div>
    <div class="right"><div class="num">${q.c?fmt(h.sh*q.c):"—"}</div><div class="num ${g>=0?"up":"down"}" style="font-size:13px">${pct(g)}</div></div>
    <div class="chips"><span class="chip num">${q.c?fmt(q.c,2):"—"} · today ${pct(q.dp)}</span>${next?`<span class="chip ev">${next.k} ${nice(next.d)}</span>`:""}${hits.length?`<span class="chip hit">Alert triggered</span>`:""}</div></button>`}).join("")}</div>`;
}
async function detail(i){
  const h=holdings[i],q=state.quotes[h.t]||{};
  V.innerHTML=`<div class="panel"><button class="back" id="back">← All holdings</button><div class="loading">Loading ${esc(h.t)} details…</div></div>`;
  bind();
  let prof={},m=state.metrics[h.t]||{},peers=[],pm={},tgt=null,recs=null,err="";
  try{prof=await fh("/stock/profile2",{symbol:h.t},1440)}catch(e){err=errText(e)}
  try{peers=(await fh("/stock/peers",{symbol:h.t},1440)||[]).filter(p=>p!==h.t&&/^[A-Z.]+$/.test(p)).slice(0,5)}catch(e){}
  for(const p of peers){try{pm[p]=(await fh("/stock/metric",{symbol:p,metric:"all"},720)).metric||{}}catch(e){}}
  try{tgt=await fh("/stock/price-target",{symbol:h.t},720)}catch(e){tgt={err:errText(e)}}
  try{const r=await fh("/stock/recommendation",{symbol:h.t},720);recs=r&&r[0]}catch(e){}
  if(current.v!=="portfolio"||current.i!==i)return;

  const rows=RATIOS.map(r=>{const v=r.g(m),peer=median(peers.map(p=>r.g(pm[p]||{})));return {...r,v,peer,gr:grade(v,peer,r.dir)}}).filter(r=>r.v!=null&&isFinite(r.v));
  const pros=rows.filter(r=>r.gr==="good").map(r=>`${r.n} of ${show1(r.v,r.u)} beats peers (${show1(r.peer,r.u)})`);
  const cons=rows.filter(r=>r.gr==="bad").map(r=>`${r.n} of ${show1(r.v,r.u)} trails peers (${show1(r.peer,r.u)})`);
  let tgtHtml;
  if(tgt&&tgt.targetMean){
    const lo=tgt.targetLow,av=tgt.targetMean,hi=tgt.targetHigh;
    tgtHtml=`<div class="kv"><div><small>Low</small><b>${fmt(lo,2)}</b></div><div><small>Average</small><b>${fmt(av,2)}</b></div><div><small>High</small><b>${fmt(hi,2)}</b></div></div>
    <p class="note">If the stock hit these targets, your holding would be worth ${fmt(h.sh*lo)} to ${fmt(h.sh*hi)} (average ${fmt(h.sh*av)}). That is ${q.c?pct((av-q.c)/q.c*100):"—"} from today's price on the average.</p>`;
  }else tgtHtml=`<p class="note">${tgt&&tgt.err?tgt.err:"No price targets available."} Analyst ratings below are still a useful guide.</p>`;
  let recHtml="";
  if(recs){const seg=[["strongBuy","#1d7a3e","Strong buy"],["buy","#5fae6e","Buy"],["hold","#c9a227","Hold"],["sell","#d7745f","Sell"],["strongSell","#b3261e","Strong sell"]];
    const tot=seg.reduce((s,x)=>s+(recs[x[0]]||0),0);
    if(tot)recHtml=`<div><h3>Analyst ratings (${esc(recs.period||"")})</h3><div class="recs">${seg.map(x=>`<span style="width:${(recs[x[0]]||0)/tot*100}%;background:${x[1]}"></span>`).join("")}</div>
    <div class="legend">${seg.map(x=>`<span>${x[2]} <b class="num">${recs[x[0]]||0}</b></span>`).join("")}</div></div>`}

  V.innerHTML=`<div class="panel"><button class="back" id="back">← All holdings</button>
  ${err?`<div class="banner err">${err}</div>`:""}
  <div><h2>${esc(prof.name||h.t)} (${esc(h.t)})</h2><div class="sub">${esc(prof.finnhubIndustry||"")}${prof.finnhubIndustry?" · ":""}<span class="num">${fmt(q.c,2)}</span> · today <span class="num ${q.dp>=0?"up":"down"}">${pct(q.dp)}</span></div></div>
  <div class="kv"><div><small>Holding value</small><b>${q.c?fmt(h.sh*q.c):"—"}</b></div><div><small>Gain</small><b class="${q.c>=h.cost?"up":"down"}">${q.c?fmt(h.sh*(q.c-h.cost)):"—"}</b></div><div><small>Dividend / share (yr)</small><b>${fmt(m.dividendPerShareTTM??m.dividendPerShareAnnual,2)}</b></div></div>
  <div><h3>Analyst 12-month price targets</h3>${tgtHtml}</div>
  ${recHtml}
  <div><h3>Key ratios vs peers</h3>
   <p class="note" style="margin-bottom:8px">Compared with the median of ${peers.length?esc(peers.join(", ")):"no peers found"}.</p>
   <div class="ratios">${rows.map(r=>`<div class="ratio ${r.gr==="none"?"":r.gr}"><span>${r.n}</span><span class="peer">peers <span class="num">${show1(r.peer,r.u)}</span></span><b class="num">${show1(r.v,r.u)}</b><span class="why"><b>${LABEL[r.gr]}.</b> ${r.h}</span></div>`).join("")||`<p class="note">No ratio data available.</p>`}</div></div>
  <div class="pc"><div><h3>Strengths</h3>${pros.length?`<ul>${pros.map(s=>`<li>${s}</li>`).join("")}</ul>`:`<p class="note">None stand out against peers.</p>`}</div>
  <div><h3>Watch-outs</h3>${cons.length?`<ul>${cons.map(s=>`<li>${s}</li>`).join("")}</ul>`:`<p class="note">None stand out against peers.</p>`}</div></div>
  </div>`;
  bind();
}
function calendar(){
  const ev=state.events;
  return `<div class="list">${ev.length?ev.map(e=>`<div class="event"><div class="date">${nice(e.d).replace(/ (\d{4})$/,"<br>$1")}</div><div><b>${esc(e.t)} · ${e.k}</b><div class="etype">${e.x}</div></div></div>`).join(""):`<div class="event"><div></div><div class="etype">No upcoming events found yet.</div></div>`}</div>
  ${state.divLocked?`<p class="note">Dividend dates aren't in Finnhub's free plan, so only earnings dates show here.</p>`:""}`;
}
function alertsView(){
  return `<div class="panel"><h3>Price alerts</h3><div class="list">${alerts.length?alerts.map((a,i)=>{const mv=alertHit(a);
    return `<div class="alert"><div><b>${esc(a.t)}</b> ${a.dir==="above"?"rises":"falls"} ${a.pct}% from your buy price${mv!=null?` · <span class="down"><b>Triggered</b> (${pct(mv)})</span>`:""}</div><button class="del" data-delalert="${i}">Remove</button></div>`}).join(""):`<div class="alert"><span class="note">No alerts yet.</span></div>`}</div>
  <form id="af"><label for="a-t">Stock<select id="a-t">${holdings.map(h=>`<option>${esc(h.t)}</option>`).join("")}</select></label>
  <label for="a-d">Direction<select id="a-d"><option value="above">Rises</option><option value="below">Falls</option></select></label>
  <label for="a-p">By %<input class="sm" id="a-p" type="number" min="1" max="95" value="10"></label><button class="btn">Add alert</button></form>
  <p class="note">Alerts are checked each time you open the app. Phone notifications come in a later version.</p></div>`;
}
function settings(){
  return `<div class="panel"><div><h3>Your holdings</h3><div class="list">${holdings.map((h,i)=>`<div class="hold"><div><b>${esc(h.t)}</b> <span class="name">${h.sh} shares at ${fmt(h.cost,2)}</span></div><button class="del" data-delhold="${i}">Remove</button></div>`).join("")||`<div class="hold"><span class="note">None yet.</span></div>`}</div></div>
  <form id="hf"><label for="h-t">Ticker<input class="sm" id="h-t" placeholder="MSFT" required></label>
  <label for="h-s">Shares<input class="sm" id="h-s" type="number" step="any" min="0" required></label>
  <label for="h-c">Buy price (US$)<input class="sm" id="h-c" type="number" step="any" min="0" required></label><button class="btn">Add holding</button></form>
  <p class="note">Your holdings are saved in this browser on this device only.</p></div>`;
}

/* ---------- routing ---------- */
const V=document.getElementById("view");
let current={v:"portfolio",i:null};
function show(v,i=null){
  current={v,i};
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  if(v==="portfolio"&&i!=null){detail(i);return}
  V.innerHTML=v==="portfolio"?portfolio():v==="calendar"?calendar():v==="alerts"?alertsView():settings();
  bind();
}
function bind(){
  V.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>show("portfolio",+b.dataset.i));
  const bk=document.getElementById("back");if(bk)bk.onclick=()=>show("portfolio");
  V.querySelectorAll("[data-delalert]").forEach(b=>b.onclick=()=>{alerts.splice(+b.dataset.delalert,1);save("hf-alerts",alerts);show("alerts")});
  V.querySelectorAll("[data-delhold]").forEach(b=>b.onclick=()=>{holdings.splice(+b.dataset.delhold,1);save("hf-holdings",holdings);renderHeader();show("settings")});
  const af=document.getElementById("af");if(af)af.onsubmit=e=>{e.preventDefault();const p=+document.getElementById("a-p").value;if(!p)return;
    alerts.push({t:document.getElementById("a-t").value,dir:document.getElementById("a-d").value,pct:p});save("hf-alerts",alerts);show("alerts")};
  const hf=document.getElementById("hf");if(hf)hf.onsubmit=e=>{e.preventDefault();
    const t=document.getElementById("h-t").value.trim().toUpperCase();
    if(!/^[A-Z][A-Z.]{0,9}$/.test(t)){msg("Use a US ticker such as MSFT or BRK.B.",true);return}
    holdings.push({t,sh:+document.getElementById("h-s").value,cost:+document.getElementById("h-c").value});
    save("hf-holdings",holdings);msg("");show("settings");loadPortfolio()};
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
show("portfolio");
loadPortfolio();
</script>
</body>
</html>
